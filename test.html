<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4TECH DEPLOY TEST</title>
</head>

<body>

<h2>4TECH DEPLOY TEST</h2>

<input id="name" value="test4tech" placeholder="Nama project">

<br><br>

<textarea id="html" rows="10" cols="40"><!DOCTYPE html>
<html>
<body>
<h1>TES 4TECH BERHASIL</h1>
</body>
</html></textarea>

<br><br>

<button onclick="deploy()">TEST DEPLOY</button>

<pre id="out"></pre>

<script>
async function deploy() {
  const out = document.getElementById("out");

  out.textContent = "Mengirim request...";

  try {
    const response = await fetch("/api/deploy", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        projectName: document.getElementById("name").value,
        html: document.getElementById("html").value
      })
    });

    const text = await response.text();

    try {
      out.textContent =
        JSON.stringify(JSON.parse(text), null, 2);
    } catch {
      out.textContent = text;
    }

  } catch (error) {
    out.textContent = "ERROR:\n" + error.message;
  }
}
</script>

</body>
</html>
